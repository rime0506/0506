<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>LoopMessage iMessage 完整教程</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f6f6f8;
            color: #26262b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.75;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 54px;
            padding: 10px max(16px, env(safe-area-inset-left));
            background: rgba(255,255,255,.94);
            border-bottom: 1px solid #ececf1;
            backdrop-filter: blur(18px);
        }
        .topbar strong { font-size: 15px; }
        .topbar a { color: #e36d83; text-decoration: none; font-size: 13px; }
        main {
            width: min(860px, calc(100% - 24px));
            margin: 18px auto 48px;
            padding: 26px clamp(18px, 4vw, 46px) 42px;
            background: #fff;
            border: 1px solid #ececf1;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(25, 25, 35, .04);
        }
        h1, h2, h3 { line-height: 1.35; scroll-margin-top: 70px; }
        h1 { margin: 0 0 22px; font-size: clamp(25px, 5vw, 34px); }
        h2 { margin: 38px 0 14px; padding-top: 6px; font-size: 21px; border-top: 1px solid #f0f0f3; }
        h3 { margin: 26px 0 10px; font-size: 17px; }
        p { margin: 10px 0; }
        .list-item { position: relative; margin: 5px 0; padding-left: 23px; }
        .list-item::before { content: "•"; position: absolute; left: 7px; color: #e36d83; }
        .number-item { margin: 6px 0; padding-left: 5px; }
        blockquote { margin: 14px 0; padding: 10px 14px; background: #fff4f6; border-left: 4px solid #ffb6c1; border-radius: 8px; color: #5c4a4f; }
        pre { overflow-x: auto; margin: 13px 0; padding: 14px; background: #19191f; color: #f3f3f5; border-radius: 11px; font: 12px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
        code { padding: 2px 5px; background: #f1f1f5; border-radius: 5px; color: #c84561; font: .9em ui-monospace, SFMono-Regular, Consolas, monospace; }
        pre code { padding: 0; background: none; color: inherit; }
        a { color: #d95772; overflow-wrap: anywhere; }
        .loading, .error { padding: 55px 10px; text-align: center; color: #8e8e93; }
        .error { color: #d42d25; }
        @media (max-width: 600px) {
            main { width: 100%; margin: 0; border: 0; border-radius: 0; box-shadow: none; }
            body { background: #fff; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <strong>LoopMessage iMessage 教程</strong>
        <a href="index.html">返回网站</a>
    </div>
    <main id="guide"><div class="loading">正在加载完整教程…</div></main>
    <script>
        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function renderInline(value) {
            let text = escapeHtml(value);
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[^)\s]+)\)/g, (_match, label, href) =>
                `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
            );
            return text;
        }

        function renderMarkdown(markdown) {
            const lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
            const html = [];
            let inCode = false;
            let codeLines = [];

            for (const line of lines) {
                if (/^```/.test(line)) {
                    if (inCode) {
                        html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                        codeLines = [];
                    }
                    inCode = !inCode;
                    continue;
                }
                if (inCode) {
                    codeLines.push(line);
                    continue;
                }
                if (!line.trim()) continue;
                if (/^###\s+/.test(line)) html.push(`<h3>${renderInline(line.replace(/^###\s+/, ''))}</h3>`);
                else if (/^##\s+/.test(line)) html.push(`<h2>${renderInline(line.replace(/^##\s+/, ''))}</h2>`);
                else if (/^#\s+/.test(line)) html.push(`<h1>${renderInline(line.replace(/^#\s+/, ''))}</h1>`);
                else if (/^>\s?/.test(line)) html.push(`<blockquote>${renderInline(line.replace(/^>\s?/, ''))}</blockquote>`);
                else if (/^\s*-\s+/.test(line)) html.push(`<div class="list-item">${renderInline(line.replace(/^\s*-\s+/, ''))}</div>`);
                else if (/^\s*\d+\.\s+/.test(line)) html.push(`<div class="number-item">${renderInline(line)}</div>`);
                else html.push(`<p>${renderInline(line)}</p>`);
            }
            if (codeLines.length) html.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
            return html.join('\n');
        }

        fetch('LOOPMESSAGE_IMESSAGE_USER_GUIDE.md', { cache: 'no-store' })
            .then(response => {
                if (!response.ok) throw new Error(`教程文件加载失败（${response.status}）`);
                return response.text();
            })
            .then(markdown => {
                document.getElementById('guide').innerHTML = renderMarkdown(markdown);
            })
            .catch(error => {
                document.getElementById('guide').innerHTML = `<div class="error">${escapeHtml(error.message)}<br>请刷新页面重试。</div>`;
            });
    </script>
</body>
</html>
